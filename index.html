<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工具箱 · Awesome AI Toolbox</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 80px}
header{text-align:center;padding:36px 0 20px}
h1{font-size:1.9em;background:linear-gradient(90deg,#58a6ff,#bc8cff,#3fb950);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);margin-top:6px;font-size:.95em}
.sub a{color:var(--accent);text-decoration:none}
.stats{display:flex;justify-content:center;gap:18px;margin-top:14px;color:var(--muted);font-size:.9em}
.stats b{color:var(--text)}
.search{width:100%;max-width:520px;margin:22px auto 0;display:block;padding:11px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1em;outline:none}
.search:focus{border-color:var(--accent)}
.bar{margin:20px 0 8px}
.bar .lbl{color:var(--muted);font-size:.85em;margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:.88em;transition:.15s;user-select:none}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;transition:.15s;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{font-size:1.05em}
.card h3 a{color:var(--text);text-decoration:none}
.card h3 a:hover{color:var(--accent)}
.star{color:var(--green);font-size:.85em;white-space:nowrap}
.cat{color:var(--muted);font-size:.8em;margin-top:2px}
.desc{color:var(--muted);font-size:.9em;margin:10px 0;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:2px 10px;border-radius:6px;background:#21262d;color:var(--accent);font-size:.78em;cursor:pointer;border:none}
.tag:hover{background:var(--accent);color:#0d1117}
.meta{margin-top:12px;font-size:.78em;color:var(--muted);display:flex;gap:12px}
.meta a{color:var(--muted)}
.count{text-align:center;color:var(--muted);margin:26px 0 0;font-size:.9em}
footer{text-align:center;color:var(--muted);font-size:.8em;margin-top:50px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🧰 AI 工具箱</h1>
<div class="sub">每日从 Twitter 精选 GitHub AI 项目 · 中文介绍 · <a href="https://github.com/AiBabyChang/awesome-ai-toolbox" target="_blank">GitHub 仓库</a></div>
<div class="stats" id="stats"></div>
<input class="search" id="q" placeholder="🔍 搜索名称 / 介绍 / 标签…">
</header>
<div class="bar"><div class="lbl">📂 按分类筛选</div><div class="chips" id="cats"></div></div>
<div class="bar"><div class="lbl">🏷️ 按标签筛选（可多选）</div><div class="chips" id="tags"></div></div>
<div class="grid" id="grid"></div>
<div class="count" id="count"></div>
<footer>同步发布 · Twitter <a href="https://x.com/Thuweni1" target="_blank">@Thuweni1</a> · 小红书 @Ai.BabyChang</footer>
</div>

 "https://github.com/TauricResearch/TradingAgents", "name": "TradingAgents", "desc": "AI 多 Agent 量化交易框架。", "tags": "量化交易,多Agent", "category": "金融数据", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/heygen-com/hyperframes", "name": "HyperFrames", "desc": "HeyGen 开源的视频生成引擎，一句话生成视频。", "tags": "视频生成", "category": "AI 视频", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/NangoHQ/nango", "name": "Nango", "desc": "开源 API 集成平台，连接数百个第三方服务。", "tags": "API集成", "category": "效率工具", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/cloudflare/agentic-inbox", "name": "Agentic Inbox", "desc": "Cloudflare 的 AI 邮件助手，自动读邮件提炼要点。", "tags": "邮件,AI助手", "category": "效率工具", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/Fincept-Corporation/FinceptTerminal", "name": "Fincept Terminal", "desc": "开源彭博终端，免费查股票和加密货币数据。", "tags": "金融终端,加密货币", "category": "金融数据", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/coollabsio/coolify", "name": "Coolify", "desc": "开源自托管 PaaS，帮人省 Vercel 费用还能收管理费。6万+星。", "tags": "自托管,PaaS", "category": "效率工具", "stars": "60k+", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/n8n-io/n8n", "name": "n8n", "desc": "工作流自动化平台，给企业搭流程收设置费+月维护费。17万+星。", "tags": "自动化,工作流", "category": "效率工具", "stars": "170k+", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/anthropics/skills", "name": "Agent Skills (Claude)", "desc": "Claude Code 官方技能库，常用操作封装成可复用指令。", "tags": "Claude,技能库", "category": "AI Agent", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/yt-dlp/yt-dlp", "name": "yt-dlp", "desc": "YouTube 下载天花板，开源免费无广告，程序员都在用。", "tags": "视频下载,免费", "category": "免费资源", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/rawfilejson/awesome-osint-arsenal", "name": "awesome-osint-arsenal", "desc": "OSINT 武器库：Volatility、Ghidra 全带安装说明，一条命令全装好。据说连朝鲜黑客都在偷偷用。", "tags": "OSINT,安全", "category": "其他", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/zhaoxuya520/reverse-skill", "name": "reverse-skill", "desc": "安全老鸟经验打成可复用技能包，逆向、渗透、CTF 全覆盖，先查路由矩阵选方法论。", "tags": "安全,技能包", "category": "其他", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/dembrandt/dembrandt", "name": "dembrandt", "desc": "2.9k star，TypeScript 写的，更新很勤。", "tags": "CLI工具", "category": "效率工具", "stars": "2.9k", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/leaperone/MultiPost-Extension", "name": "MultiPost-Extension", "desc": "一个浏览器扩展搞定全平台分发，不用再当复制粘贴机器人。", "tags": "内容分发,浏览器扩展", "category": "效率工具", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/lzwme/finance-quant-skills", "name": "finance-quant-skills", "desc": "量化技能包：查行情、拉财务、跑回测，装进 Claude Code/OpenClaw 直接说人话调用。", "tags": "量化,Claude技能", "category": "金融数据", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/mcncarl/yichen-skills", "name": "yichen-skills", "desc": "含 yichen-asr 语音转写：阶跃 Step ASR（一小时一毛五）+ 火山豆包 ASR（一小时一块钱）。", "tags": "语音转写,Claude技能", "category": "效率工具", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/Alishahryar1/free-claude-code", "name": "free-claude-code", "desc": "把 Claude Code 变成统一遥控器，吃各家免费额度。语音留言转文字直接出代码。", "tags": "Claude,免费额度", "category": "免费资源", "stars": "", "source": "", "date": "2026-08-25"}, {"repo": "https://github.com/drumih/turbo-fieldfare", "name": "Turbo Fieldfare", "desc": "Metal 4 + Swift 6.2 项目，需 Xcode 26。", "tags": "macOS,Swift", "category": "其他", "stars": "", "source": "", "date": "2026-08-25"}];
let fc = null, ft = new Set(), kw = '';
const catEmoji = {'AI Agent':'🤖','AI 视频':'🎬','AI 聊天':'💬','金融数据':'📊','免费资源':'🆓','效率工具':'⚡','其他':'📦'};
function init(){
  const cats = [...new Set(DATA.map(t=>t.category))];
  document.getElementById('cats').innerHTML =
    `<span class="chip on" data-c="">全部 ${DATA.length}</span>` +
    cats.map(c=>`<span class="chip" data-c="${c}">${catEmoji[c]||'📦'} ${c} ${DATA.filter(t=>t.category===c).length}</span>`).join('');
  const tagCount = {};
  DATA.forEach(t=>(t.tags||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>tagCount[x]=(tagCount[x]||0)+1));
  const tags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]);
  document.getElementById('tags').innerHTML = tags.map(([t,n])=>`<span class="chip" data-t="${t}">${t} ${n}</span>`).join('');
  document.getElementById('stats').innerHTML =
    `<span>📦 项目 <b>${DATA.length}</b></span><span>🏷️ 标签 <b>${tags.length}</b></span><span>📂 分类 <b>${cats.length}</b></span>`;
  render();
}
function render(){
  let list = DATA.filter(t=>{
    if(fc && t.category!==fc) return false;
    const tt = (t.tags||'').split(',').map(x=>x.trim());
    for(const need of ft) if(!tt.includes(need)) return false;
    if(kw){
      const hay = (t.name+t.desc+(t.tags||'')+t.category).toLowerCase();
      if(!hay.includes(kw)) return false;
    }
    return true;
  });
  document.getElementById('grid').innerHTML = list.map(t=>`
  <div class="card">
    <div class="top"><h3><a href="${t.repo}" target="_blank">${t.name}</a></h3>${t.stars?`<span class="star">⭐${t.stars}</span>`:''}</div>
    <div class="cat">${catEmoji[t.category]||'📦'} ${t.category}</div>
    <div class="desc">${t.desc}</div>
    <div class="tags">${(t.tags||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<button class="tag" onclick="tg('${x}')">${x}</button>`).join('')}</div>
    <div class="meta"><span>${t.date}</span>${t.source?`<a href="${t.source}" target="_blank">原帖 ↗</a>`:''}</div>
  </div>`).join('');
  document.getElementById('count').textContent = list.length ? `显示 ${list.length} / ${DATA.length} 个项目` : '没有匹配的项目，换个条件试试';
}
function tg(x){ ft.has(x)?ft.delete(x):ft.add(x); render(); syncChips(); }
document.getElementById('cats').addEventListener('click',e=>{
  const c=e.target.dataset.c; if(c===undefined)return;
  fc = c||null; syncChips(); render();
});
document.getElementById('tags').addEventListener('click',e=>{
  const t=e.target.dataset.t; if(t===undefined)return;
  ft.has(t)?ft.delete(t):ft.add(t); syncChips(); render();
});
function syncChips(){
  document.querySelectorAll('#cats .chip').forEach(el=>el.classList.toggle('on',(el.dataset.c||'')===(fc||'')));
  document.querySelectorAll('#tags .chip').forEach(el=>el.classList.toggle('on',ft.has(el.dataset.t)));
}
document.getElementById('q').addEventListener('input',e=>{kw=e.target.value.trim().toLowerCase();render();});
init();
</script>
</body>
</html>
